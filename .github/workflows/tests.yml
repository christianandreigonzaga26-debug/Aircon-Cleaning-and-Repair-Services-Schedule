name: Run Tests

# This triggers the tests whenever you push to main or open a Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      # (You would set up PHP, Node.js, or Python here depending on your app)

    - name: Install Dependencies
      run: npm install # or composer install, etc.

    - name: Run Test Suite
      run: npm test # or php artisan test, etc.
